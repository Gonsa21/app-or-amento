<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamentos - Gonsa Pinturas</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1f2937">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="fluxo.png">

    <script>
    // Registra o Service Worker para ativar o PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Ativo com sucesso!', reg))
                .catch(err => console.log('Erro ao registrar PWA:', err));
        });
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style>
        /* CONFIGURAÇÃO DA MARCA D'ÁGUA */
        .marca-dagua {
            position: relative;
        }
        .marca-dagua::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* SUBSTITUA O LINK ABAIXO PELA SUA LOGO */
            background-image: url('fluxo.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 320px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        /* Garante que o conteúdo do orçamento fique por cima da marca d'água */
        #orcamentoConteudo > * {
            position: relative;
            z-index: 1;
        }

        /* ESTILOS ESPECÍFICOS PARA A IMPRESSÃO / PDF NATIVO */
        @media print {
            body {
                background-color: #ffffff !important;
                padding: 0 !important;
            }
            #formularioCampos, footer, .botao-remover, hr, .no-print {
                display: none !important;
            }
            .max-w-md {
                max-width: 100% !important;
                box-shadow: none !important;
                padding: 0 !important;
            }
            #orcamentoConteudo {
                padding: 0 !important;
                background-color: transparent !important;
            }
            .item-orcamento {
                background-color: transparent !important;
            }
            #orcamentoNumero {
                border: none !important;
                box-shadow: none !important;
                background: transparent !important;
                padding: 0 !important;
                text-align: right !important;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-12">

    <div class="max-w-md mx-auto bg-white shadow-md p-6">
        <div>
            <div id="orcamentoConteudo" class="p-2 text-gray-800 marca-dagua bg-transparent">
                
                <header class="mb-5 border-b border-gray-200 pb-4 flex justify-between items-start">
                    <div class="flex items-center gap-4">
                        <img src="fluxo.png" alt="Logo" class="w-16 h-16 rounded-lg object-cover object-center">
                        <div class="text-left">
                            <h1 class="text-2xl font-bold text-gray-800">Orçamento</h1>
                            <p class="text-xs text-gray-500" id="pdfDataAtual"></p>
                        </div>
                    </div>
                    
                    <div class="text-right">
                        <span class="text-xs font-bold uppercase tracking-wider text-gray-400 block">Nº Documento</span>
                        <input type="text" id="orcamentoNumero" class="text-base font-bold text-blue-700 bg-gray-50 border border-gray-200 rounded px-2 py-0.5 text-right w-24 focus:outline-hidden focus:border-blue-500">
                    </div>
                </header>

                <section id="pdfDadosCliente" class="mb-5 space-y-1 hidden">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400">Cliente</h2>
                    <p class="text-base font-semibold text-gray-800" id="lblClienteNome"></p>
                    <p class="text-sm text-gray-600" id="lblClienteWhats"></p>
                </section>

                <section class="mb-5">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Serviços / Produtos</h2>
                    <div id="listaItens" class="space-y-2 mb-2">
                    </div>
                </section>

                <section class="bg-gray-800 text-white p-4 rounded-lg flex justify-between items-center mb-6">
                    <span class="text-lg font-bold">Total:</span>
                    <span id="valorTotal" class="text-2xl font-black">R$ 0,00</span>
                </section>
            </div>

            <div id="formularioCampos" class="space-y-6 border-t border-gray-200 pt-6 mt-4">
                
                <section class="space-y-4">
                    <h2 class="text-lg font-semibold text-gray-700">Dados do Cliente</h2>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Nome do Cliente</label>
                        <input type="text" id="clienteNome" placeholder="Ex: João Silva" class="mt-1 block w-full rounded-md border-gray-300 p-2 border focus:border-blue-500 focus:ring-blue-500 bg-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">WhatsApp (com DDD)</label>
                        <input type="tel" id="clienteWhats" placeholder="Ex: 27999998888" class="mt-1 block w-full rounded-md border-gray-300 p-2 border focus:border-blue-500 focus:ring-blue-500 bg-white">
                    </div>
                </section>

                <section class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-3">
                    <h2 class="text-sm font-semibold text-gray-700">Adicionar Item / Serviço</h2>
                    <div>
                        <label class="block text-xs font-medium text-gray-600">Descrição do Serviço/Material</label>
                        <input type="text" id="itemDesc" placeholder="Ex: Mão de obra de pintura" class="mt-1 block w-full rounded-md border-gray-300 p-2 border bg-white">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-600">Qtd / Horas</label>
                            <input type="number" id="itemQtd" value="1" min="1" class="mt-1 block w-full rounded-md border-gray-300 p-2 border bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600">Valor Unitário (R$)</label>
                            <input type="number" id="itemValor" placeholder="0.00" step="0.01" class="mt-1 block w-full rounded-md border-gray-300 p-2 border bg-white">
                        </div>
                    </div>
                    <button type="button" onclick="adicionarItem()" class="w-full bg-blue-600 text-white py-2 rounded-md font-medium hover:bg-blue-700 transition cursor-pointer">
                        + Adicionar Item
                    </button>
                </section>
            </div>
        </div>

        <footer class="space-y-3 mt-8 border-t border-gray-200 pt-4">
            <button onclick="gerarPDFNativo()" class="w-full bg-blue-700 text-white py-3 rounded-lg font-bold shadow-md hover:bg-blue-800 transition flex justify-center items-center gap-2 cursor-pointer">
                📄 Salvar como PDF
            </button>
            <button onclick="enviarWhatsApp()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow-md hover:bg-green-700 transition flex justify-center items-center gap-2 cursor-pointer">
                💬 Enviar texto via WhatsApp
            </button>
            <button onclick="limparFormulario()" class="w-full bg-gray-200 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-300 transition cursor-pointer">
                Limpar Tudo
            </button>
        </footer>
    </div>

    <script>
        let itensOrcamento = [];

        const data = new Date();
        document.getElementById('pdfDataAtual').innerText = `Emitido em: ${data.toLocaleDateString('pt-BR')}`;

        function gerarNumeroOrcamento() {
            const numeroAleatorio = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('orcamentoNumero').value = `#${numeroAleatorio}`;
        }

        gerarNumeroOrcamento();

        function adicionarItem() {
            const desc = document.getElementById('itemDesc').value.trim();
            const qtd = parseInt(document.getElementById('itemQtd').value) || 1;
            const valor = parseFloat(document.getElementById('itemValor').value) || 0;

            if (!desc || valor <= 0) {
                alert('Por favor, preencha a descrição e o valor do item.');
                return;
            }

            const novoItem = {
                id: Date.now(),
                descricao: desc,
                quantidade: qtd,
                valorUnitario: valor,
                total: qtd * valor
            };

            itensOrcamento.push(novoItem);
            atualizarInterface();

            document.getElementById('itemDesc').value = '';
            document.getElementById('itemQtd').value = '1';
            document.getElementById('itemValor').value = '';
            document.getElementById('itemDesc').focus();
        }

        function removerItem(id) {
            itensOrcamento = itensOrcamento.filter(item => item.id !== id);
            atualizarInterface();
        }

        function atualizarInterface() {
            const lista = document.getElementById('listaItens');
            lista.innerHTML = '';
            let totalGeral = 0;

            const nomeCliente = document.getElementById('clienteNome').value.trim();
            const whatsCliente = document.getElementById('clienteWhats').value.trim();
            
            if(nomeCliente || whatsCliente) {
                document.getElementById('pdfDadosCliente').classList.remove('hidden');
                document.getElementById('lblClienteNome').innerText = nomeCliente || 'Cliente não identificado';
                document.getElementById('lblClienteWhats').innerText = whatsCliente ? `WhatsApp: ${whatsCliente}` : '';
            } else {
                document.getElementById('pdfDadosCliente').classList.add('hidden');
            }

            itensOrcamento.forEach(item => {
                totalGeral += item.total;

                const itemDiv = document.createElement('div');
                itemDiv.className = "item-orcamento flex justify-between items-center bg-transparent p-3 border-b border-gray-100 text-sm";
                itemDiv.innerHTML = `
                    <div class="max-w-[70%]">
                        <p class="font-semibold text-gray-800 text-left">${item.descricao}</p>
                        <p class="text-xs text-gray-500 text-left">${item.quantidade}x de R$ ${item.valorUnitario.toFixed(2).replace('.', ',')}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-gray-700">R$ ${item.total.toFixed(2).replace('.', ',')}</span>
                        <button onclick="removerItem(${item.id})" class="text-red-500 font-bold hover:text-red-700 botao-remover cursor-pointer">✕</button>
                    </div>
                `;
                lista.appendChild(itemDiv);
            });

            document.getElementById('valorTotal').innerText = `R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
        }

        document.getElementById('clienteNome').addEventListener('input', atualizarInterface);
        document.getElementById('clienteWhats').addEventListener('input', atualizarInterface);

        function gerarPDFNativo() {
        if (itensOrcamento.length === 0) {
        alert('Adicione pelo menos um item antes de gerar o PDF.');
        return;
        }

        // Pega o número do orçamento e o nome do cliente
        const numOrcamento = document.getElementById('orcamentoNumero').value.replace('#', '');
        let nomeCliente = document.getElementById('clienteNome').value.trim();
        
        // Se não tiver nome de cliente, usa um padrão
        if (!nomeCliente) {
            nomeCliente = "Cliente";
        }

        // Limpa caracteres estranhos que o sistema operacional não aceita em nomes de arquivos
        const nomeLimpo = nomeCliente.replace(/[/\\?%*:|"<>]/g, '-');

        // Guarda o título original da página
        const tituloOriginal = document.title;

        // Define o novo título começando pelo NOME DO CLIENTE
        document.title = `${nomeLimpo} - Orcamento ${numOrcamento}`;

        // Abre a janela de impressão/salvamento
        window.print();

        // Restaura o título original logo após fechar a janela de impressão
        setTimeout(() => {
            document.title = tituloOriginal;
        }, 1000);
        }

        function enviarWhatsApp() {
            const nome = document.getElementById('clienteNome').value.trim() || "Cliente";
            const whats = document.getElementById('clienteWhats').value.trim().replace(/\D/g, '');
            const numOrcamento = document.getElementById('orcamentoNumero').value;

            if (itensOrcamento.length === 0) {
                alert('Adicione pelo menos um item ao orçamento.');
                return;
            }

            const totalGeral = itensOrcamento.reduce((sum, item) => sum + item.total, 0);
            let texto = `Olá, *${nome}*!\nSegue o *Orçamento ${numOrcamento}* solicitado:\n\n`;
            
            itensOrcamento.forEach((item, index) => {
                texto += `*${index + 1}. ${item.descricao}*\n`;
                texto += `Qtd: ${item.quantidade} | Unitário: R$ ${item.valorUnitario.toFixed(2).replace('.', ',')}\n`;
                texto += `Subtotal: R$ ${item.total.toFixed(2).replace('.', ',')}\n\n`;
            });

            texto += `───────────────────\n`;
            texto += `*Valor Total: R$ ${totalGeral.toFixed(2).replace('.', ',')}*\n\n`;
            texto += `Qualquer dúvida estou à disposição!`;

            const textoCodificado = encodeURIComponent(texto);
            let urlWhats = `https://wa.me/`;
            if (whats) { urlWhats += (whats.length === 11) ? `55${whats}` : whats; }
            urlWhats += `?text=${textoCodificado}`;

            window.open(urlWhats, '_blank');
        }

        function limparFormulario() {
            if (confirm('Deseja limpar todo o orçamento atual?')) {
                document.getElementById('clienteNome').value = '';
                document.getElementById('clienteWhats').value = '';
                itensOrcamento = [];
                atualizarInterface();
                gerarNumeroOrcamento();
            }
        }
    </script>
</body>
</html>
